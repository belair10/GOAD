- name: Sync the contents of one directory to another - hack to get Requires -Module Ansible.ModuleUtils.Legacy loaded
  community.windows.win_robocopy:
    src: C:\windows\temp
    dest: C:\windows\temp

- name: Create users
  microsoft.ad.user:
    identity: "{{ item.key }}"
    firstname: "{{item.value.firstname}}"
    surname: "{{ item.value.surname | default(item.value.firstname) }}"
    password: "{{ item.value.password }}"
    password_never_expires: true
    state: present
    path: "{{item.value.path|default('CN=Users,' + default_ldap_path)}}"
    description: "{{item.value.description | default('-')}}"
    groups: 
      add: "{{ item.value.groups | default([])}}"
    city: "{{item.value.city | default('-')}}"
    domain_username: "{{domain_username}}"
    domain_password: "{{domain_password}}"
  loop: "{{ad_users | dict2items }}"
  loop_control:
    label: "{{item.key}}@{{domain}}"
  register: usercreate
  until: "usercreate is not failed"
  retries: 3
  delay: 30

- name: Set users SPN lists
  microsoft.ad.user:
    name: "{{ item.key }}"
    spn: 
      add: "{{item.value.spns}}"
    domain_username: "{{domain_username}}"
    domain_password: "{{domain_password}}"
  with_dict: "{{ ad_users }}"
  when: item.value.spns is defined
