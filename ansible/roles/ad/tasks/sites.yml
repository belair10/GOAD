---
# Create physical sites
- name: Create sites
  ansible.windows.win_powershell: 
    script: |
      [CmdletBinding()]
      param (
        [String]$username,
        [String]$password,
        [String]$site_name
      )

      $secpass = $password | ConvertTo-SecureString -AsPlainText -Force
      $cred = New-Object System.Management.Automation.PSCredential($username, $secpass)

      if (-not (Get-ADReplicationSite -Filter "Name -eq '$site_name'" -Credential $cred)) {
        New-ADReplicationSite -Name $site_name -Credential $cred
      }
      else {
        $Ansible.Changed = $false
      }
    parameters:
      username: "{{ domain_username }}"
      password: "{{ domain_password }}"
      site_name: "{{ item.key }}"
  with_dict: "{{ ad_sites }}"

