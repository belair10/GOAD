- name: Create subnets and link to sites
  ansible.windows.win_powershell:
    script: |
      [CmdletBinding()]
      param (
        [String]$username,
        [String]$password,
        [String]$site_name,
        [String]$subnet
      )

      $secpass = $password | ConvertTo-SecureString -AsPlainText -Force
      $cred = New-Object System.Management.Automation.PSCredential($username, $secpass)

      if (-not (Get-ADReplicationSite -Filter "Name -eq '$subnet'" -Credential $cred)) {
        New-ADReplicationSubnet -Name $subnet -Site $site_name -Credential $cred
      }
      else {
        $Ansible.Changed = $false
      }
    parameters:
      username: "{{ domain_username }}"
      password: "{{ domain_password }}"
      site_name: "{{ item.key }}"
      subnet: "{{ item.value.subnet }}"
  with_dict: "{{ ad_sites }}"
  