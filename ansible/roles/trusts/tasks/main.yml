      if (-not (Get-ADTrust -Filter "Target -eq '$remoteDomain'")) {
        netdom trust $($localdomain) /domain:$($remoteDomain) /add /oneside:trusting /usero:$($localCred.Username) /passwordo:$($localCred.GetNetworkCredential().Password) /passwordt:$($trustPassword)
