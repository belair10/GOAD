---
# Load datas
- import_playbook: data.yml
  vars:
    data_path: "../ad/{{domain_name}}/data/"
  tags: 'data'
# set AD trusts ==================================================================================================

- name: Trusts configuration
  hosts: child_dc,forest_root_dc,tree_root_dc
  serial: 1 # add one trust at a time to avoid issues
  roles:
  - { role: 'trusts', tags: 'trust' }
  vars:
    domain: "{{lab.hosts[dict_key].domain}}"
    domain_admin_username: "{{admin_user}}@{{domain}}"
    domain_admin_password: "{{lab.domains[domain].domain_password}}"
    trusts: "{{lab.domains[domain].trusts | default({})}}"
    trust_password: "{{lab.domains[domain].trusts.trust_password|default('Toortoor1337')}}"
